[barcode]
# Size of the barcode squares as they appear in the source PDF (mm)
source_barcode_size_mm = 10
 
# Size of the barcode square on the output PDF label (mm)
print_barcode_size_mm = 20
 
# Total square paper/label size on the output PDF (mm)
print_paper_size_mm = 25

# Gap between sequece number and barcode (mm)
seq_num_gap_mm = 1.5

[processing]
# PDF pages processed at the same time. Each worker uses about one CPU core.
# Peak memory, 96-page A4 PDF with 4 codes per page (see README):
#   1: ~410 MB   2: ~570 MB   4: ~690 MB   6: ~1010 MB   8: ~1190 MB
# mem_limit 1000m: 4 or lower. 6 and 8 need mem_limit of at least 1500m.
workers = 4