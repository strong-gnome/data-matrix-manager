[barcode]
# Size of the barcode squares as they appear in the source PDF (mm)
source_barcode_size_mm = 10
 
# Size of the barcode square on the output PDF label (mm)
print_barcode_size_mm = 20
 
# Total square paper/label size on the output PDF (mm)
print_paper_size_mm = 25

# Gap between sequece number and barcode (mm)
seq_num_gap_mm = 1.5

[processing]
# PDF pages processed at the same time. Each page in progress uses about
# 50 MB (A4 at 400 DPI), so keep it within the container memory limit.
workers = 4